<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crypTerm</title>
    <!-- Pico.css for instant dark theme -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        /* Force the body to fit 100% of screen height without scrolling */
        html, body {
            height: 100dvh;
            margin: 0;
            overflow: hidden; /* Stops vertical and horizontal scrolling */
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Evenly spaces Header, Cryptex, and D-Pad */
            align-items: center;
        }

        header {
            text-align: center;
            margin-top: 0.1rem;
        }

        header h1 {
            margin-bottom: 0;
            font-size: clamp(1.5rem, 4vh, 2.5rem);
        }

        header p {
            margin-bottom: 0;
            font-size: clamp(0.8rem, 2vh, 1rem);
        }

        /* The Cryptex Grid */
        .cryptex-container {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            font-family: monospace;
            font-size: clamp(1rem, 2.5vh, 1.5rem);
        }

        .column {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.2rem;
            border: 2px solid transparent;
            border-radius: 8px;
        }

        .column.active {
            border-color: var(--pico-primary);
        }

        /* Sizing cells based on screen HEIGHT so it never overflows */
        .letter-cell {
            width: clamp(26px, 4.5vh, 42px);
            height: clamp(26px, 4.5vh, 42px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .letter-cell.target-row {
            background-color: var(--pico-primary-background);
            color: var(--pico-primary-inverse);
            font-weight: bold;
            border-radius: 4px;
        }

        /* Sizing D-Pad buttons based on screen HEIGHT */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, clamp(40px, 7vh, 55px));
            grid-template-rows: repeat(3, clamp(40px, 7vh, 55px));
            gap: 5px;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .dpad button {
            padding: 0;
            font-size: 1.2rem;
            /* Taps only, no zooming! */
            touch-action: manipulation;
        }
    </style>

</head>
<body class="container">

    <header style="display: flex; flex-direction: column; align-items: center; margin-top: 1rem; margin-bottom: 0.11rem;">
        <h1 style="margin-bottom: 0;">crypTerm</h1>
        
        <!-- This wrapper hugs the width of the paragraph text -->
        <div style="width: fit-content;">
            <p style="margin-bottom: 0.2rem;">Align the hidden word between the pointers.</p>
            
            <!-- Flexbox row: Timer on the left, Archive on the right -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 0.2rem;">
                <span id="timer-display" style="font-family: monospace; color: var(--pico-primary); font-weight: bold; font-size: 1.2rem;">
                    00:00
                </span>
                <a href="/archive" style="font-size: 0.8rem;">View Archive</a>
            </div>
        </div>
    </header>

    <main>
        <!-- The Cryptex Grid -->
        <!-- In your <main> section, update the cryptex-container columns: -->
        <div class="cryptex-container" id="cryptex">
            {% for col in columns %}
            <!-- We attach the target letter for this column directly to the DOM element -->
            <div class="column {% if loop.first %}active{% endif %}" 
                data-col-index="{{ loop.index0 }}"
                data-target-letter="{{ theme_word[loop.index0] }}">
                
                {% for letter in col %}
                <div class="letter-cell {% if loop.index0 == pointer_index %}target-row{% endif %}">
                    {{ letter }}
                </div>
                {% endfor %}
            </div>
            {% endfor %}
        </div>
        
        <!-- The win animation status thing -->
        <div id="game-status">

        </div>
        <!-- Controls Wrapper -->
        <div style="display: flex; flex-direction: column; align-items: flex-end; width: fit-content; margin: 0 auto;">
            
            <!-- Hint Button (Pinned to the Top-Right of the D-Pad) -->
            <button id="hint-btn" onclick="revealHint()" class="outline secondary" style="padding: 0.2rem 0.6rem; font-size: 0.8rem; margin-bottom: 0.5rem; width: auto;">
                Hint
            </button>

            <!-- The SNES D-Pad Controls -->
            <div class="dpad">
                <div></div>
                <button onclick="spinColumn('up')">△</button>
                <div></div>
                <button onclick="selectColumn('left')">◁</button>
                <button onclick="checkWordAutomatically()" class="secondary"> </button>
                <button onclick="selectColumn('right')">▷</button>
                <div></div>
                <button onclick="spinColumn('down')">▽</button>
                <div></div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>

        <!-- The Victory Modal -->
    <dialog id="score-modal">
        <article>
            <header>
                <button aria-label="Close" rel="prev" onclick="document.getElementById('score-modal').removeAttribute('open')"></button>
                <p><strong>🎉 System Unlocked!</strong></p>
            </header>
            
            <div id="modal-content">
                <p>You cracked the crypTerm in <span id="modal-time-display" style="color: var(--pico-primary); font-family: monospace; font-weight: bold;"></span>!</p>
                
                <!-- HTMX posts the data to Flask without reloading the page -->
                <form hx-post="/submit_score" hx-target="#modal-content" hx-swap="innerHTML">
                    <!-- Hidden inputs to secretly pass the timer and the date -->
                    <input type="hidden" id="hidden-time" name="time_in_seconds" value="">
                    <input type="hidden" name="puzzle_date" value="{{ play_date }}">
                    
                    <label for="nickname">Enter your nickname:</label>
                    <input type="text" id="nickname" name="nickname" placeholder="e.g. Alex" required maxlength="20">
                    
                    <button type="submit">Submit Score</button>
                </form>
            </div>
        </article>
    </dialog>
</body>
</html>
